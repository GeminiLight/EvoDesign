<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <g transform="translate(256, 256)">
    <!-- Infinity Path -->
    <path d="M -100 -60 C -180 -60 -180 60 -100 60 C -20 60 20 -60 100 -60 C 180 -60 180 60 100 60 C 20 60 -20 -60 -100 -60 Z"
          fill="none" stroke="#e2e8f0" stroke-width="12" />

    <!-- Active Edges -->
    <g fill="none" stroke-width="20" stroke-linecap="round" filter="url(#shadow)">
      <path d="M -100 -60 C -180 -60 -180 60 -100 60 C -60 60 -30 30 0 0" stroke="url(#grad-left)" />
      <path d="M 0 0 C 30 -30 60 -60 100 -60 C 180 -60 180 60 100 60" stroke="url(#grad-right)" />

      <!-- Branching edges -->
      <path d="M -140 0 L -140 -80" stroke="url(#grad-left)" stroke-width="12" />
      <path d="M 140 0 L 140 80" stroke="url(#grad-right)" stroke-width="12" />
      <path d="M 0 0 L 0 80" stroke="#8b5cf6" stroke-width="12" />
    </g>

    <!-- Diagram Nodes -->
    <g stroke-width="6" fill="#ffffff" filter="url(#shadow)">
      <!-- Left Loop -->
      <rect x="-124" y="-76" width="48" height="32" rx="8" stroke="#3b82f6" />
      <rect x="-124" y="44" width="48" height="32" rx="8" stroke="#7c3aed" />
      <circle cx="-140" cy="-80" r="12" stroke="#3b82f6" />
      <circle cx="-140" cy="0" r="6" fill="#6366f1" stroke="none" />

      <!-- Center -->
      <polygon points="0,-24 24,0 0,24 -24,0" stroke="#8b5cf6" stroke-linejoin="round" />
      <circle cx="0" cy="80" r="12" stroke="#8b5cf6" />

      <!-- Right Loop -->
      <rect x="76" y="-76" width="48" height="32" rx="8" stroke="#c026d3" />
      <rect x="76" y="44" width="48" height="32" rx="8" stroke="#ec4899" />
      <circle cx="140" cy="80" r="12" stroke="#ec4899" />
      <circle cx="140" cy="0" r="6" fill="#d946ef" stroke="none" />
    </g>
  </g>
</svg>
