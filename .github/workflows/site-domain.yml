name: Site domain checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated research metadata
        run: |
          node scripts/sync-research.mjs
          git diff --exit-code
      - name: Verify canonical, sitemap and retired-host URLs
        env:
          SITE_URL: https://tianfu.wang/EvoDesign/
          SITE_DIR: docs
        run: python3 scripts/verify-domain.py
      - name: Guard first-load rendering dependencies and resource sizes
        run: python3 scripts/check_site_performance.py
