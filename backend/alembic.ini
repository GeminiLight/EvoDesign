# Alembic configuration for the EvoDiagram backend.
#
# Usage (run from backend/ with the backend venv, e.g. backend/venv/bin/alembic):
#   alembic upgrade head                              apply migrations to the configured database
#   alembic revision --autogenerate -m "change"       create a migration from model diffs
#   alembic stamp head                                adopt an existing create_all database without running SQL
#
# The database URL is NOT read from this file: migrations/env.py resolves it
# from app.config get_settings().database_url (DB_TYPE/DB_NAME/... env vars or
# .env files), so alembic always targets the same database as the application.
# JWT_SECRET and SESSION_SECRET must be resolvable (env or .env) because
# importing app.config validates them.
#
# The application startup path still runs create_all + bootstrap repairs for
# backward compatibility; see app/db/bootstrap.py for how existing databases
# are reported as unmanaged.

[alembic]
# %(here)s keeps the script location anchored to this file, so alembic works
# regardless of the process working directory.
script_location = %(here)s/migrations

# Template used to generate migration files (referenced by file name below).
# file_template = %%(rev)s_%%(slug)s

# Timezone for file_template rendering; leave unset for local time.
# timezone =

# Truncate slug to at most this many characters.
# truncate_slug_length = 40

# Set to 'true' to run the environment during the split (offline) mode.
# Do not set sqlalchemy.url here; env.py overrides it from application settings.
# sqlalchemy.url is intentionally absent.

# Logging configuration consumed by fileConfig() inside env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
